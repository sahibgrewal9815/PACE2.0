<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>PACE — Coach Login</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070708">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="icons/icon-96.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pace-ui.css?v=5">
<style>
.wrap{min-height:var(--app-h,100vh);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bot) + 20px);}
.card{width:100%;max-width:400px;animation:rise .5s cubic-bezier(.16,1,.3,1);}
.logo{display:flex;justify-content:center;color:var(--text);margin-bottom:14px;}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--acc);text-align:center;margin-bottom:30px;}
.alert{display:none;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:13px;background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:#ffb3b3;}
.alert.show{display:block;}
.back{text-align:center;margin-top:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;}
.back a{color:var(--text3);text-decoration:none;}
</style>
</head>
<body>
<canvas id="bg-dots"></canvas>
<div class="bg-glow"></div>
<div class="toast" id="toast"></div>
<div class="scroll"><div class="wrap"><div class="card">
  <div class="logo" id="logo"></div>
  <div class="sub">COACH DASHBOARD</div>
  <div class="w" style="padding:22px">
    <div class="alert" id="err"></div>
    <div class="field"><label class="label">Username</label><input class="input" id="username" autocomplete="username" autocapitalize="none" placeholder="username"></div>
    <div class="field"><label class="label">Password</label><input class="input" type="password" id="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn acc" id="btn" onclick="doLogin()">Enter dashboard →</button>
  </div>
  <div class="back"><a href="index.html">← ATHLETE LOGIN</a></div>
</div></div></div>

<script src="pace-ui.js?v=5"></script>
<script>
(function () {
  const P = PACE;
  P.startDots();
  P.setMx('logo', 'PACE', 9, { intro: true });
  const tok = localStorage.getItem('pace2_trainer_token');
  if (tok) P.rpc('trainer_check', { p_token: tok }).then(t => { if (t) location.replace('trainer.html'); }).catch(() => {});

  window.doLogin = async function () {
    const u = document.getElementById('username').value.trim(), p = document.getElementById('password').value;
    if (!u || !p) return;
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Checking…'; err.classList.remove('show');
    try {
      const r = await P.rpc('trainer_login', { p_username: u, p_password: p });
      if (r && r.token) {
        localStorage.setItem('pace2_trainer_token', r.token);
        localStorage.setItem('pace2_trainer_session', JSON.stringify(r.trainer));
        location.replace('trainer.html'); return;
      }
      err.textContent = r && r.error === 'locked' ? 'Too many wrong tries. Wait 15 minutes.' : 'Wrong username or password.';
    } catch (e) { err.textContent = 'Couldn\'t reach the server. Check your internet.'; }
    err.classList.add('show'); btn.disabled = false; btn.innerHTML = 'Enter dashboard →';
  };
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
})();
</script>
</body>
</html>
