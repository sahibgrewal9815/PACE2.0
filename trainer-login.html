<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PACE — Trainer Login</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --acc: #FF5500; --acc2: #FF8C00;
  --text: #fff; --text2: rgba(255,255,255,0.55); --text3: rgba(255,255,255,0.28);
  --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
}
html, body {
  min-height: 100dvh;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255,85,0,0.16) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(255,140,0,0.1) 0%, transparent 55%),
    #060608;
  color: var(--text); font-family: 'Inter', sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; padding-top: calc(var(--safe-top) + 24px);
}
.card {
  width: 100%; max-width: 420px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  outline: 1px solid rgba(255,255,255,0.13); outline-offset:-1px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  border-radius: 28px; padding: 36px 32px;
}
.logo {
  font-size: 44px; font-weight: 900; letter-spacing: -3px;
  background: linear-gradient(135deg, #fff, var(--acc2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 4px;
}
.subtitle { font-size: 13px; color: var(--text3); letter-spacing: 1px; margin-bottom: 32px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.input {
  width: 100%; padding: 14px 16px; margin-bottom: 16px;
  background: rgba(255,255,255,0.05); border: 0;
  outline: 1px solid rgba(255,255,255,0.12); outline-offset:-1px;
  border-radius: 14px; color: var(--text); font-size: 15px; font-weight: 500;
  font-family: 'Inter', sans-serif;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  transition: outline-color 0.2s;
}
.input:focus { outline-color: rgba(255,85,0,0.5); }
.btn {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  border: none; border-radius: 16px; color: white;
  font-size: 16px; font-weight: 800; font-family: 'Inter', sans-serif;
  cursor: pointer; box-shadow: 0 6px 24px rgba(255,85,0,0.35);
  margin-top: 4px; transition: all 0.2s;
}
.btn:hover { box-shadow: 0 8px 32px rgba(255,85,0,0.5); }
.error { color: #ef4444; font-size: 13px; margin-top: 12px; text-align:center; display:none; }
.back { text-align:center; margin-top:20px; font-size:13px; color:var(--text3); }
.back a { color:var(--acc2); text-decoration:none; font-weight:600; }
.loader { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="card">
  <div class="logo">PACE</div>
  <div class="subtitle">TRAINER DASHBOARD</div>
  <div class="label">Username</div>
  <input class="input" type="text" id="username" placeholder="sahibdeep" autocomplete="username">
  <div class="label">Password</div>
  <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" id="login-btn" onclick="doLogin()">Enter Dashboard →</button>
  <div class="error" id="err-msg">Invalid credentials. Try again.</div>
  <div class="back"><a href="index.html">← Athlete Login</a></div>
</div>

<script>
(function(){
  const SB_URL = 'https://blnqehdnorjvboxcqiap.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsbnFlaGRub3JqdmJveGNxaWFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNzEzNjUsImV4cCI6MjExMDc0NzM2NX0.gMJ1LuHZ9SpN6_2hsO6XJJXr67qFrOgyM-GRRfziXVs';
  const H = { 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':`Bearer ${SB_KEY}` };

  // Check existing session
  const sess = localStorage.getItem('pace2_trainer_session');
  if (sess) window.location.href = 'trainer.html';

  window.doLogin = async function() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) return;
    const btn = document.getElementById('login-btn');
    btn.innerHTML = '<span class="loader"></span> Logging in...';
    btn.disabled = true;
    document.getElementById('err-msg').style.display = 'none';
    try {
      const r = await fetch(`${SB_URL}/rest/v1/trainers?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}`, { headers: H });
      const data = await r.json();
      if (data && data.length > 0) {
        localStorage.setItem('pace2_trainer_session', JSON.stringify(data[0]));
        window.location.href = 'trainer.html';
      } else {
        document.getElementById('err-msg').style.display = 'block';
        btn.innerHTML = 'Enter Dashboard →';
        btn.disabled = false;
      }
    } catch(e) {
      document.getElementById('err-msg').textContent = 'Connection error. Try again.';
      document.getElementById('err-msg').style.display = 'block';
      btn.innerHTML = 'Enter Dashboard →';
      btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
